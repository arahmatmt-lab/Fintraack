<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#142B4A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="FINTRACK — Aplikasi Pengelolaan Keuangan Pribadi Mobile PWA dengan Neumorphism & Glassmorphism." />
  <title>FINTRACK — Personal Finance Management</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script>
    try {
      var t = localStorage.getItem('fintrack_theme');
      if (t === 'dark' || t === 'night') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Ambient Brandkit Backdrop (tampak lembut pada layar lebar & di balik elemen Glassmorphism) -->
  <div class="ambient-backdrop" aria-hidden="true">
    <div class="ambient-orb orb-navy"></div>
    <div class="ambient-orb orb-blue"></div>
    <div class="ambient-orb orb-emerald"></div>
  </div>

  <!-- Mobile App Shell -->
  <div id="mobile-shell" class="mobile-shell">
    <!-- Auth Gate View (Multi-User Personal Finance) -->
    <section id="auth-view" class="auth-view hidden" aria-label="Masuk ke FINTRACK"></section>

    <!-- Authenticated App View -->
    <div id="app-shell" class="app-shell hidden">
      <!-- Glassmorphism Top Header -->
      <header id="top-header" class="glass-header">
        <div class="header-left">
          <button type="button" id="btn-brand-home" class="brand-pill btn-glass-subtle" aria-label="Beranda FINTRACK">
            <img src="/icons/icon.svg" alt="FINTRACK" class="brand-icon" />
            <div class="brand-text-wrap">
              <span class="brand-name">FINTRACK</span>
              <span id="header-subtitle" class="brand-sub">Keuangan Pribadi</span>
            </div>
          </button>
        </div>
        <div class="header-actions">
          <button type="button" id="btn-theme-toggle" class="btn-glass-icon" title="Ganti Tema (Terang / Dark / Night)" aria-label="Ganti Tema Tampilan">
            <span class="icon-slot" data-icon="sun"></span>
          </button>
          <button type="button" id="btn-quick-scan" class="btn-glass-icon btn-glass-emerald-tint" title="Scan Struk" aria-label="Scan Struk">
            <span class="icon-slot" data-icon="scan"></span>
          </button>
          <button type="button" id="btn-notifications" class="btn-glass-icon" title="Notifikasi" aria-label="Notifikasi">
            <span class="icon-slot" data-icon="bell"></span>
            <span id="notif-badge" class="notif-badge hidden">0</span>
          </button>
          <button type="button" id="btn-user-avatar" class="btn-glass-avatar" title="Akun Pengguna" aria-label="Akun Pengguna">
            <span id="user-initials">AR</span>
          </button>
        </div>
      </header>

      <!-- Main Scrollable Viewport -->
      <main id="app-main" class="app-main" tabindex="-1"></main>

      <!-- Floating Glassmorphism Quick-Add FAB -->
      <button type="button" id="btn-fab-add" class="fab-glass" title="Catat Transaksi Baru" aria-label="Catat Transaksi Baru">
        <span class="icon-slot" data-icon="plus"></span>
      </button>

      <!-- Glassmorphism Bottom Navbar (5 Menu Utama sesuai Bagian 4) -->
      <nav id="bottom-navbar" class="glass-navbar" aria-label="Navigasi Utama">
        <div id="nav-liquid-indicator" class="nav-liquid-indicator" aria-hidden="true"></div>
        <button type="button" class="nav-item active" data-tab="beranda">
          <span class="nav-icon" data-icon="home"></span>
          <span class="nav-label">Beranda</span>
        </button>
        <button type="button" class="nav-item" data-tab="transaksi">
          <span class="nav-icon" data-icon="swap"></span>
          <span class="nav-label">Transaksi</span>
        </button>
        <button type="button" class="nav-item" data-tab="kalender">
          <span class="nav-icon" data-icon="calendar"></span>
          <span class="nav-label">Kalender</span>
        </button>
        <button type="button" class="nav-item" data-tab="anggaran">
          <span class="nav-icon" data-icon="pie"></span>
          <span class="nav-label">Anggaran</span>
        </button>
        <button type="button" class="nav-item" data-tab="lainnya">
          <span class="nav-icon" data-icon="grid"></span>
          <span class="nav-label">Lainnya</span>
        </button>
      </nav>
    </div>

    <!-- Modal / Bottom Sheet Root (Glassmorphism Sheet + Neumorphism Controls) -->
    <div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true"></div>

    <!-- Toast Notifications Root -->
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </div>

  <!-- Local Vendor Libraries (Offline-ready via Service Worker) -->
  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/vendor/jspdf.umd.min.js"></script>
  <script src="/vendor/xlsx.full.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
